<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>NumberCheck – make agent link</title>
<style>body{font:15px system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#13201a}input,textarea{width:100%;font:inherit;padding:10px;border:1.5px solid #dfe5e0;border-radius:10px;box-sizing:border-box}button{font:inherit;padding:10px 16px;border:0;border-radius:10px;background:#0f3d2e;color:#fff;margin-top:10px}p.h{color:#64736b;font-size:13px}</style></head>
<body>
<h2>Make the agents' setup link</h2>
<p class="h">Type the same secret text you saved in GitHub as <b>NUMBERCHECK_SALT</b>. Nothing you type here leaves this page.</p>
<input id="salt" type="password" autocomplete="off" placeholder="NUMBERCHECK_SALT">
<button id="go">Make link</button>
<div id="out" style="display:none">
  <p><b>Send this link to agents</b> (keep it private, like a password):</p>
  <textarea id="link" rows="4" onclick="this.select()"></textarea>
  <p id="chk" class="h"></p>
</div>
<script>
document.getElementById('go').onclick=async function(){
  var s=document.getElementById('salt').value.trim(); if(!s) return;
  var base=location.href.replace(/admin\.html.*$/,'').replace(/\/$/,'');
  var code=btoa(JSON.stringify({s:s,u:base})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  document.getElementById('link').value=base+'/#setup='+code;
  document.getElementById('out').style.display='block';
  try{
    var m=await (await fetch('data/manifest.json',{cache:'no-store'})).json();
    var b=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('check:'+s)));
    var c=Array.from(b.slice(0,6)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
    document.getElementById('chk').textContent = c===m.saltCheck ? '✓ Matches the published list ('+m.total.toLocaleString()+' numbers).' : '✗ Does not match the published list. Check the secret text.';
  }catch(e){document.getElementById('chk').textContent='(No published list found yet.)'}
};
</script>
</body></html>
