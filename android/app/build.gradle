plugins { id 'com.android.application' }

android {
    namespace 'com.numbercheck.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.numbercheck.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '0.1-pilot'
    }
    signingConfigs {
        release {
            def ks = file(System.getenv('KEYSTORE_FILE') ?: 'none')
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'numbercheck'
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { checkReleaseBuilds false; abortOnError false }
    dependenciesInfo { includeInApk false; includeInBundle false }
}
